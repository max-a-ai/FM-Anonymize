<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FM-Anonymize{% endblock %}</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
  --line: #dfe3ea; --accent: #2a78d6; --ok: #1b8a4b; --bad: #c0392b;
  --code: #eef1f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2;
    --line: #2d333d; --accent: #5b9cf0; --ok: #3cc47c; --bad: #ef6b5b;
    --code: #252a33;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap;
  padding: 14px max(16px, calc((100% - 1200px) / 2));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 19px; margin: 0; }
header nav a {
  color: var(--muted); text-decoration: none; margin-right: 16px;
}
header nav a.on { color: var(--text); font-weight: 600; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
p.lead { color: var(--muted); max-width: 820px; }
code, pre {
  background: var(--code); border-radius: 6px;
  font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
}
code { padding: 1px 5px; }
pre { padding: 10px 12px; overflow-x: auto; white-space: pre; }
a { color: var(--accent); }
.note { font-size: 13px; color: var(--muted); }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <h1>FM-Anonymize</h1>
</header>
<main>{% block main %}{% endblock %}</main>
{% block script %}{% endblock %}
</body>
</html>
