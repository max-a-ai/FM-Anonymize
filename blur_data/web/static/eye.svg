<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- line-art eye, sharp on the left, blurred more and more to the right -->
  <defs>
    <g id="eye" fill="none" stroke="#1c5e6c" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 21 Q32 6 56 21" />
      <path d="M4 36 Q32 14 60 36 Q32 58 4 36 Z" />
      <circle cx="32" cy="36" r="9" />
    </g>
    <linearGradient id="ramp" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.95" stop-color="#fff" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="ramp-inv" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.3" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.95" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="sharp" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="url(#ramp-inv)" />
    </mask>
    <mask id="soft" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="url(#ramp)" />
    </mask>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>
  <use href="#eye" mask="url(#sharp)" />
  <g mask="url(#soft)"><use href="#eye" filter="url(#blur)" /></g>
</svg>
