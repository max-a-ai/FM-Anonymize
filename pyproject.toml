[project]
name = "fm-anonymize"
version = "0.1.0"
description = "FM-Anonymize: training-free anonymization of driving data with SAM 3 and SAM 3D Body."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "numpy>=1.26,<2",
    "pillow>=10",
    "opencv-python>=4.11",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "sam3",
    # sam-3d-body has no package metadata; its imports, installed here
    # and put on sys.path by blur_data.models.body (see HANDOFF.md).
    "pytorch-lightning>=2.5",
    "yacs>=0.1.8",
    "omegaconf>=2.3",
    "roma>=1.5",
    "einops>=0.8",
    "timm>=1.0.17",
    "trimesh>=4",
    "braceexpand>=0.1.7",
    "scikit-image>=0.24",
    "huggingface-hub>=0.26",
    "pyrootutils>=1.0",
    "loguru>=0.7",
    "setuptools<81",  # sam3 imports pkg_resources
    "pycocotools>=2.0.8",  # sam3 imports it at load time
    "termcolor>=2.4",  # dinov3 hub backbone of sam-3d-body
    "pyyaml>=6",
]

[project.scripts]
blur-data = "blur_data.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blur_data"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
sam3 = { path = "third_party/sam3", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
    "pytest>=8",
    "types-pyyaml>=6.0.12.20260906",
    "types-tqdm>=4.70.0.20260906",
]
baselines = [
    "deface>=1.5.0",
    "egoblur>=2.0.0a1",
    "onnxruntime-gpu>=1.31.0",
]
attack = [
    "easyocr>=1.7.2",
    "onnxruntime>=1.31.0",
]
# FM-Anonymize-Gen: SD 1.5 inpainting, ControlNets, IP-Adapter-FaceID
inpaint = [
    "accelerate>=1.15.0",
    "diffusers>=0.42.1",
    "transformers>=5.21.1",
]
app = [
    "flask>=3.1.3",
]

[tool.uv]
default-groups = ["dev", "app"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["."]
extend-exclude = ["third_party", "resources", "outputs", "checkpoints", "datasets"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RET",
    "N",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app.py", "blur_data", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "sam3.*",
    "sam_3d_body.*",
    "cv2.*",
    "torchvision.*",
    "matplotlib.*",
    "pycocotools.*",
    "deface.*",
    "gen2.*",
    "onnxruntime.*",
    "easyocr.*",
    "autoware_rosbag2_anonymizer.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# inpaint group: optional, partly typed; treated as Any
module = ["diffusers.*", "transformers.*", "accelerate.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
